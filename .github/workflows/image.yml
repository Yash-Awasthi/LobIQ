name: image

# Builds the container (tests run inside the build) and runs its demos on every pull request; on
# main it also publishes ghcr.io/<owner>/lobiq and the demo reports to GitHub Pages; on v* tags, the image.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

# Two quick merges once let the older commit's Pages deploy land last; the newer run now cancels it.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          IMG=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/lobiq
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          docker build -t "$IMG:${GITHUB_SHA::12}" .
      - name: demos in the image
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -e HFT_COMMIT="${GITHUB_SHA::7}" -v "$PWD/out:/hft/out" "$IMG:${GITHUB_SHA::12}"
          test -s out/index.html && test -s out/paper/report.html && test -s out/backtest/naive/report.html && test -s out/studio/snapshot.json
      - name: publish
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMG:${GITHUB_SHA::12}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag=latest; fi
          docker tag "$IMG:${GITHUB_SHA::12}" "$IMG:$tag"
          docker push "$IMG:$tag"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: out
          retention-days: 7
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
