name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        preset: [debug, release, asan, ubsan, tsan]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          sudo git -C "$VCPKG_INSTALLATION_ROOT" fetch origin master
          sudo git -C "$VCPKG_INSTALLATION_ROOT" checkout -qf "$(jq -r '.["builtin-baseline"]' vcpkg.json)"
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - if: matrix.preset == 'release'
        run: build/release/bench/hft_bench --benchmark_min_time=0.01s
      - if: matrix.preset == 'release'
        run: scripts/check_cli.sh build/release/apps
      - if: matrix.preset == 'release'
        run: scripts/demo/backtest.sh
      - if: matrix.preset == 'release'
        run: HFT_BIN=build/release/apps scripts/demo/paper.sh
      - if: matrix.preset == 'release'
        name: strategy templates build and run
        run: |
          scripts/new_strategy.sh ci_probe && scripts/new_strategy.sh --quoter ci_probe_q
          cmake --preset release && cmake --build build/release --target itch_backtest pm_exec
          build/release/apps/itch_backtest 2>&1 | grep -q ci_probe
          build/release/apps/pm_exec --replay data/sample/pm-20261009T1600-20min --config config/exec.cfg --quoter ci_probe_q

  perf-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          sudo git -C "$VCPKG_INSTALLATION_ROOT" fetch origin master
          sudo git -C "$VCPKG_INSTALLATION_ROOT" checkout -qf "$(jq -r '.["builtin-baseline"]' vcpkg.json)"
      - run: sudo apt-get install -y valgrind
      - name: build this change and its base
        run: |
          base=$(git merge-base HEAD origin/master)
          [ "$GITHUB_EVENT_NAME" = push ] && base=$(git rev-parse HEAD^1)
          git worktree add "$RUNNER_TEMP/base" "$base"
          for d in . "$RUNNER_TEMP/base"; do
            (cd "$d" && cmake --preset release && cmake --build build/release --target book_study book_replay pm_live gen_day ingest)
          done
      - run: scripts/perf_gate.sh "$RUNNER_TEMP/base/build/release" build/release

  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/security_gates.sh

  fpga:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y verilator
      - run: cmake -S fpga -B build/fpga -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/fpga
      - run: ctest --test-dir build/fpga --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          sudo git -C "$VCPKG_INSTALLATION_ROOT" fetch origin master
          sudo git -C "$VCPKG_INSTALLATION_ROOT" checkout -qf "$(jq -r '.["builtin-baseline"]' vcpkg.json)"
      - run: cmake --preset fuzz
      - run: cmake --build build/fuzz --target itch_fuzz tape_fuzz oms_fuzz ws_fuzz book_load_fuzz
      - run: |
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/json" "$RUNNER_TEMP/oms" "$RUNNER_TEMP/ws" "$RUNNER_TEMP/book"
          build/fuzz/fuzz/itch_fuzz -max_total_time=60 "$RUNNER_TEMP/corpus"
          build/fuzz/fuzz/tape_fuzz -max_total_time=60 "$RUNNER_TEMP/json"
          build/fuzz/fuzz/oms_fuzz -max_total_time=60 "$RUNNER_TEMP/oms"
          build/fuzz/fuzz/ws_fuzz -max_total_time=60 "$RUNNER_TEMP/ws"
          build/fuzz/fuzz/book_load_fuzz -max_total_time=60 "$RUNNER_TEMP/book"
